name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Bubblewrap for sandbox tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # GitHub-hosted runners disable unprivileged user namespaces.
          # Enable Bubblewrap's setuid mode on this disposable runner so isolation tests execute.
          sudo chmod u+s /usr/bin/bwrap
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
