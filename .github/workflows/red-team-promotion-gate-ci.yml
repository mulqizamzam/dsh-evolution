name: Red Team Promotion Gate CI

on:
  push:
    branches:
      - feat/red-team-promotion-gate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Bubblewrap for sandbox tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # The hosted runner disables unprivileged user namespaces. Enable
          # Bubblewrap's audited setuid mode on this disposable CI VM so its
          # namespace-based sandbox is actually usable by the runner account.
          sudo chmod u+s /usr/bin/bwrap

      - name: Verify Bubblewrap isolation support
        run: |
          ls -l /usr/bin/bwrap
          bwrap --version
          bwrap --die-with-parent --unshare-pid --unshare-net --ro-bind /usr /usr --proc /proc --dev /dev /bin/sh -c 'echo bwrap-ok'

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        if: always()
        run: npm run typecheck

      - name: Build
        if: always()
        run: npm run build
